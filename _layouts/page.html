---
layout: default
---
<section class="article{% unless page.image.feature %} pad-top{% endunless %}">
  {% if page.image.feature %}<div class="overlay"></div><div class="featured-image" style="background-image: url('{{ '/images/' | relative_url }}{{ page.image.feature }}')"></div>{% endif %}
  <article class="wrap post">
    <header class="post-header"><h1>{{ page.title }}</h1>{% if page.description %}<p class="intro">{{ page.description }}</p>{% endif %}</header>
    {{ content }}
  </article>
</section>
